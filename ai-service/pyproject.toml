[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daiap-ai-service"
version = "1.0.0"
description = "Document parsing, embeddings, reranking and PII detection for the DAIAP backend (contract v1)"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "orjson>=3.10",
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "huggingface-hub>=0.24",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "py3langid>=0.3",
  "presidio-analyzer>=2.2.355",
  "spacy>=3.7,<3.9",
  "anyio>=4.4",
]

[project.optional-dependencies]
# Several replicas sharing one replay-protection store.
redis = ["redis>=5.0"]
# OCR for scanned PDFs (PaddleOCR models on ONNX Runtime).
ocr = ["rapidocr>=3.0"]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=4", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["models: needs the downloaded model files (skipped otherwise)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]
